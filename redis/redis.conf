# 网络配置 - 允许所有IP访问
bind 0.0.0.0
protected-mode yes

# 安全配置 - 强密码必须设置
requirepass F3w%9pZ!Q@iXk2mA8

# 持久化配置
appendonly yes
appendfsync everysec
appendfilename "appendonly.aof"

# RDB持久化
save 900 1
save 300 10
save 60 10000
dbfilename dump.rdb
dir /data

# 内存管理
maxmemory 512mb
maxmemory-policy noeviction

# 性能优化
timeout 300
tcp-keepalive 300
tcp-backlog 511

# 日志
loglevel notice
logfile ""

# 慢查询日志
slowlog-log-slower-than 10000
slowlog-max-len 128

# 数据库数量
databases 16

# 禁用危险命令
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command CONFIG ""
rename-command KEYS ""
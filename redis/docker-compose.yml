services:
  redis:
    image: redis:7-alpine
    container_name: redis-server
    restart: unless-stopped  # 修改为unless-stopped
    ports:
      - "19531:6379"
    volumes:
      - ./volumes/redis:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "YourStrongPasswordHere123!@#", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3
services:
  xinference:
    image: xprobe/xinference:latest-cpu
    container_name: xinference
    hostname: xinference
    env_file:
      - .env
    ports:
      - "9997:9997"
    volumes:
      # Xinference config & model registry metadata
      - ./volumes/xinference:/root/.xinference
      # HuggingFace model cache (pre-downloaded models go here too)
      - ./volumes/models/huggingface:/root/.cache/huggingface
      # ModelScope model cache (pre-downloaded models go here too)
      - ./volumes/models/modelscope:/root/.cache/modelscope
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      - HF_HOME=/root/.cache/huggingface
      - MODELSCOPE_CACHE=/root/.cache/modelscope
    command: xinference-local --host 0.0.0.0 --port 9997
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9997/v1/models || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 8G
